name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Restore
        run: dotnet restore 7daysModLauncher.Tests/7daysModLauncher.Tests.csproj
      - name: Build app
        run: dotnet build 7daysModLauncher.csproj --no-restore -c Release
      - name: Test
        run: dotnet test 7daysModLauncher.Tests/7daysModLauncher.Tests.csproj --no-build -c Release

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Publish single file
        run: dotnet publish 7daysModLauncher.csproj -c Release -r win-x64 -p:PublishSingleFile=true -p:SelfContained=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o release_single
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_single/7daysModLauncher.exe
          generate_release_notes: true
